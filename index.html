<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Game</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <h1>Click Game</h1>
  
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  
  <div class="stats">
    <p>Score: <span id="score">0</span></p>
  </div>
  
  <button id="githubBtn" onclick="window.open('https://github.com/debigchonkmonke-dotcom', '_blank')">
    <svg viewBox="0 0 23 23" xmlns="http://www.w3.org/2000/svg">
      <path fill="#0078d4" d="M2.25 0C1.007 0 0 1.007 0 2.25v18.5C0 21.993 1.007 23 2.25 23h18.5c1.243 0 2.25-1.007 2.25-2.25V2.25C23 1.007 21.993 0 20.75 0H2.25zM12.5 6.5v3h-2v-3h2zm-4 0v3h-2v-3h2zm8 0v3h-2v-3h2zm-4 5v5h-2v-5h2zm-4 0v5h-2v-5h2zm8 0v5h-2v-5h2z"/>
    </svg>
    GitHub
  </button>
  
  <footer>
    <p>&copy; 2026 Click Game</p>
  </footer>
  
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let score = 0;
    
    canvas.addEventListener('click', (e) => {
      score++;
      document.getElementById('score').textContent = score;
      
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      ctx.fillStyle = `hsl(${Math.random() * 360}, 70%, 60%)`;
      ctx.beginPath();
      ctx.arc(x, y, 20, 0, Math.PI * 2);
      ctx.fill();
    });
    
    function animate() {
      ctx.fillStyle = 'rgba(34, 34, 34, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      requestAnimationFrame(animate);
    }
    
    animate();
  </script>
</body>
</html>
